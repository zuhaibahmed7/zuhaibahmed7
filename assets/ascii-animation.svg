<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544 573" width="544" height="573" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .frame { fill: none; stroke: #2ea88a; stroke-opacity: 0.5; stroke-width: 1; }
      .row {
        font-size: 10px;
        fill: #39d98a;
        opacity: 0;
        white-space: pre;
        animation: reveal 6.0s ease-in-out infinite;
        text-shadow: 0 0 4px rgba(57,217,138,0.6);
      }
      @keyframes reveal {
        0%   { opacity: 0; }
        4%   { opacity: 1; }
        78% { opacity: 1; }
        88%  { opacity: 0; }
        100% { opacity: 0; }
      }
      .cursor {
        fill: #39d98a;
        font-size: 12px;
        animation: blink 1s steps(2) infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .caption {
        fill: #6fe3ab;
        font-size: 11px;
        letter-spacing: 1px;
      }
    </style>
  </defs>

