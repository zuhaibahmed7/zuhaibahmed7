<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 783 422" width="783" height="422" font-family="Consolas, Menlo, 'Liberation Mono', 'SFMono-Regular', monospace">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .frame { fill: none; stroke: #30363d; stroke-width: 1; }
      .art { font-size: 11px; fill: #58a6ff; white-space: pre; }
      .user { font-size: 12px; font-weight: bold; fill: #39d98a; white-space: pre; }
      .sep { font-size: 12px; fill: #58a6ff; white-space: pre; }
      .label { font-size: 12px; fill: #8b949e; }
      .value { font-size: 12px; fill: #c9d1d9; }
      .row {
        opacity: 0;
        animation: reveal 7.0s ease-in-out infinite;
      }
      @keyframes reveal {
        0%   { opacity: 0; }
        3%   { opacity: 1; }
        80% { opacity: 1; }
        90%  { opacity: 0; }
        100% { opacity: 0; }
      }
      .swatch {
        opacity: 0;
        animation: reveal 7.0s ease-in-out infinite;
      }
      .cursor {
        fill: #39d98a;
        animation: blink 1s steps(2) infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

